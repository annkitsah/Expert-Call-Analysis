[project]
name = "expert-call-analyst"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # readable stopword string

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixtures carry long verbatim quotes

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
